<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/salo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SALO — Order. Reserve. Gather. Modern Filipino restaurant ordering, multi-kitchen checkout, table reservations, and delivery platform." />
    <meta name="theme-color" content="#C8532A" />

    <!-- Open Graph / Social Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SALO — Order. Reserve. Gather." />
    <meta property="og:description" content="Order from multiple kitchens in one checkout, send dishes to different addresses, or reserve authentic dining tables with live confirmation." />
    <meta property="og:image" content="/brand/salo-icon.png" />

    <title>SALO — Order. Reserve. Gather.</title>

    <!-- Self-hosted fonts -->
    <link rel="preload" href="/fonts/fraunces-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dmsans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Prevent theme flash: apply stored theme before render -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('salo-theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored);
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
